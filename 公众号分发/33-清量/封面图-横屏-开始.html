<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080"/>
<title>封面-清量分节-开始</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(150deg,#1e293b,#0f172a);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px}
.orb1{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.3),transparent);top:-150px;right:-100px;filter:blur(60px)}
.orb2{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(220,38,38,.2),transparent);bottom:-100px;left:-100px;filter:blur(60px)}
.content{position:relative;z-index:1;text-align:center;max-width:1600px}
.label{font-size:28px;color:#60a5fa;letter-spacing:4px;margin-bottom:24px}
.title{font-size:88px;font-weight:900;color:#ffffff;line-height:1.2;margin-bottom:20px}
.highlight{color:#f87171}
.sub{font-size:40px;color:#94a3b8;line-height:1.5;margin-top:20px}
.brand{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);color:#64748b;font-size:24px;letter-spacing:2px}
.line{width:120px;height:4px;background:linear-gradient(90deg,#2563eb,#ef4444);margin:20px auto;border-radius:2px}
</style>
</head>
<body>
<div class="orb1"></div>
<div class="orb2"></div>
<div class="content">
  <div class="label">奇美星暖通风管制作</div>
  <div class="title">清量分节</div>
  <div class="line"></div>
  <div class="title" style="font-size:56px;margin-top:10px;">风管厂最容易被低估的 <span class="highlight">「翻译」</span> 工作</div>
  <div class="sub">把设计院的图纸语言 翻译成车间能听懂的料单</div>
</div>
<div class="brand">奇美星暖通风管制作 · tangguoqi.top</div>
</body>
</html>
