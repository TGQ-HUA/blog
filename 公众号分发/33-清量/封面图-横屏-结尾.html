<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080"/>
<title>封面-清量分节-结尾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(150deg,#0f172a,#1e3a5f);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px}
.orb1{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.25),transparent);top:-80px;right:10%;filter:blur(60px)}
.orb2{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.2),transparent);bottom:-60px;left:20%;filter:blur(60px)}
.content{position:relative;z-index:1;text-align:center;max-width:1600px}
.title{font-size:72px;font-weight:900;color:#ffffff;line-height:1.3;margin-bottom:30px}
.highlight{color:#60a5fa}
.quote{font-size:40px;color:#cbd5e1;font-style:italic;line-height:1.6;max-width:1400px;margin:20px auto 30px}
.line{width:100px;height:4px;background:linear-gradient(90deg,#2563eb,#60a5fa);margin:20px auto;border-radius:2px}
.brand{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);color:#64748b;font-size:24px;letter-spacing:2px}
.qr-note{font-size:28px;color:#94a3b8;margin-top:30px}
</style>
</head>
<body>
<div class="orb1"></div>
<div class="orb2"></div>
<div class="content">
  <div class="quote">「我做的这个分节，拿到车间师傅手上，他能直接干吗？」</div>
  <div class="line"></div>
  <div class="title">能把这事想明白了</div>
  <div class="title"><span class="highlight">技术部的水平就上去一半</span></div>
  <div class="qr-note">关注奇美星 · 每周分享风管行业干货</div>
</div>
<div class="brand">奇美星暖通风管制作 · tangguoqi.top</div>
</body>
</html>
