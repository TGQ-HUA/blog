<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>风管加固</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden; 
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  display: flex; align-items: center; justify-content: center;
}
#stage {
  position:relative; width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.m { 
  position:absolute; opacity:0; font-size:42px; line-height:1.5;
  color:#e8edf5; text-align:center; width:880px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:88px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:72px; font-weight:700; color:#7ec8e3; }
.bnum { font-size:100px; font-weight:900; color:#ff7e5f; }
.m-sep { height:14px; }
.card-accent { border-color:rgba(240,208,96,0.25); background:rgba(240,208,96,0.04); }
.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="95">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="95" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>
// ====== BEAT DATA ======
// [start, end, type, text(s)]
const beats = [
  [0.100, 1.462, 'btitle', ['风管加固']],
  [1.412, 3.541, 'btitle', ['差不多先生栽过的跟头']],
  [3.541, 5.844, 'card', ['上个月车间老赵来找我']],
  [5.844, 7.951, 'card', ['说有个工地退货了']],
  [7.951, 10.324, 'card-blue', ['1000×400 镀锌风管']],
  [10.324, 11.886, 'bare', ['装上去三个月']],
  [11.886, 13.958, 'card-orange', ['甲方说风管瘪了']],
  [13.958, 15.775, 'bare', ['图纸没标要加固']],
  [15.775, 17.673, 'bare', ['但国标写得很清楚']],
  [17.673, 20.300, 'bmid', ['矩形风管长边 > 630mm']],
  [20.300, 21.793, 'btitle', ['就必须加固！']],
  [21.793, 24.120, 'card-blue', ['老赵那批管子长边1000mm']],
  [24.120, 25.497, 'card-blue', ['完全超标']],
  [25.497, 27.719, 'bare', ['空调一开 负压一吸']],
  [27.719, 29.629, 'card-orange', ['侧面直接凹进去了']],
  [29.629, 31.157, 'bare', ['不是质量问题']],
  [31.157, 32.650, 'bare', ['是设计漏项']],
  [32.650, 35.428, 'card', ['这个坑 全国一半的厂都踩过']],
  [35.428, 37.546, 'btitle', ['国标三条硬杠杠']],
  [37.546, 39.178, 'bmid', ['① 看长边尺寸']],
  [39.178, 41.006, 'card-blue', ['低压系统 > 630mm']],
  [41.006, 42.696, 'card-blue', ['中压系统 > 500mm']],
  [42.696, 44.421, 'card-blue', ['高压系统 > 400mm']],
  [44.421, 46.018, 'bmid', ['② 看面积']],
  [46.018, 47.824, 'card', ['低压风管 > 1.2m²']],
  [47.824, 49.456, 'card', ['中高压风管 > 1.0m²']],
  [49.456, 51.574, 'bare', ['很多人只知道看长边']],
  [51.574, 53.576, 'card-orange', ['不知道面积也会触发']],
  [53.576, 55.266, 'bmid', ['③ 看保温']],
  [55.266, 57.465, 'card', ['保温管可放宽到800mm']],
  [57.465, 59.652, 'btitle', ['三种加固方式怎么选']],
  [59.652, 61.874, 'card-blue', ['中小尺寸 首选压筋']],
  [61.874, 64.490, 'card-blue', ['共板法兰流水线直接轧制']],
  [64.490, 65.972, 'card-blue', ['不增加成本']],
  [65.972, 67.916, 'card-orange', ['大尺寸 加角钢框']],
  [67.916, 69.305, 'card-orange', ['强度最好']],
  [69.305, 72.083, 'card', ['超大尺寸 角钢框+内支撑']],
  [72.083, 73.310, 'card', ['双保险']],
  [73.310, 75.393, 'bare', ['圆管直径超过800mm']],
  [75.393, 77.152, 'bare', ['加扁钢加固圈（抱箍）']],
  [77.152, 78.796, 'card-blue', ['圆管纵向咬口']],
  [78.796, 81.400, 'card-blue', ['直径 > 500mm 必须铆钉固定']],
  [81.400, 83.715, 'card-blue', ['运输一颠簸 容易裂开']],
  [83.715, 85.671, 'bare', ['风管加固不是成本']],
  [85.671, 88.392, 'btitle', ['该做不做 才是最大的浪费']],
  [88.392, 90.138, 'card', ['老赵现在学乖了']],
  [90.138, 92.256, 'card', ['排版前先翻操作表']],
  [92.256, 94.571, 'card', ['补一次的钱 够做好几次了']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
    }
    else { el.className = 'm ' + (type === 'card-blue' ? 'card-blue' : type === 'card-orange' ? 'card-orange' : ''); }
    el.textContent = t;
    if (type === 'bare') el.style.fontSize = '44px';
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  // Fade in
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  // Hold
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  // Fade out
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
