<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>工艺性检测</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden; 
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  display: flex; align-items: center; justify-content: center;
}
#stage {
  position:relative; width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.m { 
  position:absolute; opacity:0; font-size:42px; line-height:1.5;
  color:#e8edf5; text-align:center; width:880px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:88px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:72px; font-weight:700; color:#7ec8e3; }
.bnum { font-size:100px; font-weight:900; color:#ff7e5f; }
.m-sep { height:14px; }
.card-accent { border-color:rgba(240,208,96,0.25); background:rgba(240,208,96,0.04); }
.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="121">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="121" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>
// ====== BEAT DATA ======
// [start, end, type, text(s)]
const beats = [
  [0.1, 4.274, 'btitle', ['工艺性检测']],
  [4.224, 9.641, 'card', ['一个同行翻车了', '排烟风管拉到现场', '漏风量测试不合格']],
  [9.641, 14.687, 'card', ['低压段超标准一倍', '中压段法兰接口', '漏得像筛子']],
  [14.687, 16.990, 'bare', ['全部拆掉重做']],
  [16.990, 19.212, 'bare', ['几千块运费打水漂']],
  [19.212, 20.601, 'bmid', ['问题出在哪']],
  [20.601, 24.108, 'card-blue', ['没做过工艺性检测']],
  [24.108, 30.254, 'card', ['GB50243写得明明白白', '批量生产前', '先做一节试试']],
  [30.254, 34.560, 'card', ['低压用漏光法', '灯管塞风管里', '暗处看漏光点']],
  [34.560, 36.932, 'bare', ['中高压', '用漏风量测试台']],
  [36.932, 39.641, 'card-orange', ['十个厂里', '七八个不做']],
  [39.641, 40.682, 'bare', ['为什么']],
  [40.682, 45.150, 'card', ['工期太紧', '甲方只给十天十五天', '谁有空先测一节']],
  [45.150, 49.050, 'card-blue', ['漏风量测试台', '不是标配', '小厂觉得没必要买']],
  [49.050, 52.118, 'card', ['最大的问题', '没人知道该谁来做']],
  [52.118, 56.203, 'bare', ['车间推给质检', '质检说没人教过']],
  [56.203, 58.102, 'bmid', ['结果就是没人做']],
  [58.102, 59.710, 'bare', ['但现在不一样了']],
  [59.710, 65.879, 'card', ['GB51251标准出来后', '排烟风管必须通过', '漏风量测试才能验收']],
  [65.879, 68.634, 'bare', ['消防那关过不去']],
  [68.634, 71.527, 'card-orange', ['返工的钱', '够买好几台测试仪']],
  [71.527, 73.344, 'bmid', ['实操上注意几条']],
  [73.344, 76.921, 'card', ['漏光灯用100瓦以上', '灯管别太粗']],
  [76.921, 81.111, 'card-blue', ['风管两端封严', '法兰盲板或厚塑料膜']],
  [81.111, 86.319, 'card', ['黑暗环境检查', '接缝法兰口咬口转角', '一个一个看']],
  [86.319, 90.335, 'bare', ['每十米接缝', '漏光点不超过两处']],
  [90.335, 93.298, 'card', ['没有测试条件', '有个笨办法']],
  [93.298, 97.951, 'card', ['第一批管子双面打胶', '法兰垫片加厚到5mm']],
  [97.951, 101.087, 'bare', ['成本高一点', '但能降低返工概率']],
  [101.087, 104.884, 'card', ['老刘的管子拆回来', '发现是一个冲头磨了']],
  [104.884, 107.234, 'bare', ['换个冲头', '再测就过了']],
  [107.234, 114.722, 'btitle', ['工艺性检测', '花不了多少时间']],
  [114.722, 120.219, 'card', ['奇美星暖通风管制作', '技术干货 踩坑实录', 'tangguoqi.top']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
    }
    else { el.className = 'm ' + (type === 'card-blue' ? 'card-blue' : type === 'card-orange' ? 'card-orange' : ''); }
    el.textContent = t;
    if (type === 'bare') el.style.fontSize = '44px';
    if (type === 'btitle') el.style.fontSize = '88px';
    if (type === 'bmid') el.style.fontSize = '72px';
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
