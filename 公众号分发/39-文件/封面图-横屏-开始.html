<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>封面-开始</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden;
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
  display:flex; align-items:center; justify-content:center;
}
#stage {
  width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.title { font-size:88px; font-weight:900; color:#f0d060; text-align:center; margin-bottom:30px; }
.subtitle { font-size:48px; color:#e8edf5; text-align:center; margin-bottom:20px; }
.tag { font-size:36px; color:#7ec8e3; text-align:center; }
.line { width:200px; height:3px; background:#f0d060; margin:30px 0; }
.highlight { font-size:42px; color:#ff7e5f; text-align:center; margin-top:40px; }
</style>
</head>
<body>
<div id="stage">
  <div class="line"></div>
  <div class="title">共享文件夹里一坨"最终版"</div>
  <div class="subtitle">风管厂文件管理</div>
  <div class="subtitle">我用系统收拾了</div>
  <div class="line"></div>
  <div class="highlight">2000个文件 → 300个</div>
  <div class="highlight">事故归零</div>
  <div class="tag" style="margin-top:60px;">奇美星暖通风管制作 · 管理经验</div>
</div>
</body>
</html>
