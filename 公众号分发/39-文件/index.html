<!DOCTYPE html>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden; 
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  display: flex; align-items: center; justify-content: center;
}
#stage {
  position:relative; width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.m { 
  position:absolute; opacity:0; font-size:42px; line-height:1.5;
  color:#e8edf5; text-align:center; width:880px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:88px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:72px; font-weight:700; color:#7ec8e3; }
.bnum { font-size:100px; font-weight:900; color:#ff7e5f; }
.m-sep { height:14px; }
.card-accent { border-color:rgba(240,208,96,0.25); background:rgba(240,208,96,0.04); }
.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="194">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="194" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>

  [50.231, 53.530, 'bmid', ['文件存在三个地方', '版本根本对不上']],
  [53.530, 57.997, 'card', ['排版员改了一版', '存在本地', '车间用的还是上周那版']],

  [72.708, 76.273, 'card', ['第一条', '砍掉最终版', '改成三段式版本']],
  [76.273, 80.775, 'card-blue', ['系统自动生成文件名', '项目编号_日期_版本序号']],
  [80.775, 83.773, 'bare', ['版本号自动增加', '每次保存加一']],
  [83.773, 88.414, 'card', ['旧版本不删', '标记为历史版本', '车间只管当前版本']],
  [88.414, 91.145, 'bmid', ['第二条', '一次上传，三路归档']],
  [91.145, 95.381, 'card', ['排版员点一下', '执行排版留档', '系统自动做三件事']],
  [95.381, 100.416, 'bare', ['文件复制到共享盘', '上传企业微信云盘', '数据库记录入库']],
  [100.416, 104.189, 'card-blue', ['谁什么时候', '做了什么项目', '多少平方，一清二楚']],

  [106.770, 109.109, 'bare', ['不是所有旧文件', '都要删']],
  [109.109, 112.094, 'card-blue', ['按项目按时间', '做索引，标记状态']],
  [112.094, 119.456, 'bare', ['当前版本 → 正在用', '历史版本 → 可追溯', '废弃版本 → 作废']],
  [119.456, 122.199, 'card', ['光是清理这一步', '就花了两个月']],
  [122.199, 126.886, 'card-orange', ['清完之后', '两千多个文件', '降到不到三百个']],

  [143.923, 147.037, 'card', ['最让我觉得值的是', '排版员小刘说的话']],
  [147.037, 152.071, 'card', ['唐哥，现在下班直接走', '不用再想一遍', '我传了没有']],
  [152.071, 156.481, 'btitle', ['好风管不是算出来的', '是干出来的']],
  [156.481, 160.092, 'card', ['但干出来的前提是', '车间拿到的图纸', '是对的']],
  [160.092, 162.813, 'bmid', ['文件管理', '不是什么高大上的事']],
  [162.813, 168.564, 'card', ['就是保证车间师傅', '拿到的那张图', '跟确认的版本是同一个']],
  [168.564, 169.999, 'bare', ['就这么简单']],
  [169.999, 176.851, 'card', ['不怪技术员', '系统靠人记靠人传靠人命名', '迟早出事']],
  [176.851, 180.787, 'card-orange', ['怪流程', '流程里有空子', '早晚有人掉进去']],
  [180.787, 183.668, 'bare', ['你们厂的共享文件夹', '还好吗']],
  [183.668, 187.569, 'card', ['回去翻翻看', '说不定也有十七个版本', '的同款惊喜']],
  [187.569, 194.166, 'card', ['奇美星暖通风管制作', '技术干货 管理经验', 'tangguoqi.top']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
    }
    else { el.className = 'm ' + (type === 'card-blue' ? 'card-blue' : type === 'card-orange' ? 'card-orange' : ''); }
    el.textContent = t;
    if (type === 'bare') el.style.fontSize = '44px';
    if (type === 'btitle') el.style.fontSize = '88px';
    if (type === 'bmid') el.style.fontSize = '72px';
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
