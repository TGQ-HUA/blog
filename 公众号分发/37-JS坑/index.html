<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>JS宏踩坑</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden; 
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  display: flex; align-items: center; justify-content: center;
}
#stage {
  position:relative; width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.m { 
  position:absolute; opacity:0; font-size:38px; line-height:1.5;
  color:#e8edf5; text-align:center; width:880px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:88px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:72px; font-weight:700; color:#7ec8e3; }
.bnum { font-size:100px; font-weight:900; color:#ff7e5f; }
.m-sep { height:14px; }
.card-accent { border-color:rgba(240,208,96,0.25); background:rgba(240,208,96,0.04); }
.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="140">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="140" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>
// ====== BEAT DATA ======
// [start, end, type, text(s)]
const beats = [
  [0.100, 3.371, 'btitle', ['从Delphi转WPS JS宏']],
  [3.321, 5.416, 'card-orange', ['踩过的坑比想象中的深']],
  [5.416, 8.692, 'card', ['上个月车间日报那个宏突然罢工了']],
  [8.692, 12.326, 'card', ['小周跑过来说报红字']],
  [12.326, 16.631, 'bare', ['不知道哪个变量出了问题']],
  [16.631, 20.150, 'card-blue', ['WPS JS的报错不给你堆栈']],
  [20.150, 22.268, 'btitle', ['查了一下午才找到原因']],
  [22.268, 25.405, 'card', ['有个班组昨天没干活']],
  [25.405, 30.694, 'card-orange', ['取空单元格返回undefined']],
  [30.694, 32.731, 'card-orange', ['后面所有操作全崩了']],
  [32.731, 38.530, 'bmid', ['思维惯性不改 迟早要栽']],
  [38.530, 40.416, 'btitle', ['第一个坑：undefined']],
  [40.416, 45.092, 'bare', ['不是null 不是空字符串']],
  [45.092, 49.259, 'card-blue', ['先判断是不是undefined再操作']],
  [49.259, 51.238, 'btitle', ['第二个坑：索引打架']],
  [51.238, 55.937, 'card', ['WPS集合从1开始']],
  [55.937, 60.243, 'card', ['JS数组从0开始']],
  [60.243, 64.144, 'card-orange', ['一个函数里两套混用 容易忘加一']],
  [64.144, 67.430, 'btitle', ['第三个坑：返回值不固定']],
  [67.430, 72.048, 'card-blue', ['取一个单元格 返回标量值']],
  [72.048, 76.828, 'card-blue', ['取一片区域 返回二维数组']],
  [76.828, 79.155, 'card-orange', ['数据只有一条 宏就崩了']],
  [79.155, 83.298, 'btitle', ['第四个坑：传中文参数']],
  [83.298, 86.446, 'card', ['Run传中文变乱码']],
  [86.446, 89.282, 'bare', ['不同WPS版本表现不一样']],
  [89.282, 90.335, 'bmid', ['怎么办？']],
  [90.335, 92.986, 'card-blue', ['不传字符串 传数字编号']],
  [92.986, 95.555, 'card-blue', ['让宏自己查字典']],
  [95.555, 97.858, 'bare', ['我不是科班出身的程序员']],
  [97.858, 102.245, 'card', ['我是做风管的 管排版管下料']],
  [102.245, 106.192, 'card', ['白天干活 晚上自学']],
  [106.192, 109.768, 'card-blue', ['WPS JS资料真的不多']],
  [109.768, 112.777, 'card-orange', ['网上文章东一篇西一篇']],
  [112.777, 116.435, 'bare', ['踩坑笔记记了23条']],
  [116.435, 120.057, 'card', ['大部头书没有']],
  [120.057, 124.756, 'card-blue', ['Obsidian里全是血泪史']],
  [124.756, 128.032, 'card', ['小周说宏现在很稳了']],
  [128.032, 132.291, 'card-orange', ['那是我先填了二十三个坑']],
  [132.291, 133.923, 'bare', ['不是因为我水平高']],
  [133.923, 137.395, 'bare', ['老李说 跟做风管一样']],
  [137.395, 139.895, 'btitle', ['不是手艺多好 是错犯够了']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
    }
    else { el.className = 'm ' + (type === 'card-blue' ? 'card-blue' : type === 'card-orange' ? 'card-orange' : ''); }
    el.textContent = t;
    if (type === 'bare') el.style.fontSize = '44px';
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  // Fade in
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  // Hold
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  // Fade out
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
