// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;transform-style:preserve-3d;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bnum') { el.className = 'm bnum'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
      el.style.fontSize = '40px';
    }
    else if (type === 'card-blue') { el.className = 'm card-blue'; }
    else if (type === 'card-orange') { el.className = 'm card-orange'; }
    else { el.className = 'm'; }
    el.textContent = t;
    div.appendChild(el);
  });
  stage.appendChild(div);

// ====== GSAP TIMELINE (cardIn/cardOut 3D翻转) ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const isBare = (type === 'bare');
  const dur = end - start - 0.3;
  if (isBare) {
    tl.fromTo(el, {opacity:0, y:24}, {opacity:1, y:0, duration:0.28, ease:'power2.out'}, start);
  } else {
    tl.fromTo(el, {opacity:0, rotationY:-18, scale:0.85}, {opacity:1, rotationY:0, scale:1, duration:0.32, ease:'back.out(1.4)'}, start);
  }
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  if (isBare) {
    tl.to(el, {opacity:0, y:-16, duration:0.18, ease:'power2.in'}, end - 0.18);
  } else {
    tl.to(el, {opacity:0, rotationY:14, scale:0.92, duration:0.18, ease:'power2.in'}, end - 0.18);
  }
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
