<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>隐蔽工程</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden; 
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  display: flex; align-items: center; justify-content: center;
}
#stage {
  position:relative; width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.m { 
  position:absolute; opacity:0; font-size:38px; line-height:1.5;
  color:#e8edf5; text-align:center; width:880px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:86px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:72px; font-weight:700; color:#7ec8e3; }
.bnum { font-size:100px; font-weight:900; color:#ff7e5f; }
.m-sep { height:14px; }
.card-accent { border-color:rgba(240,208,96,0.25); background:rgba(240,208,96,0.04); }
.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="147">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="147" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>
// ====== BEAT DATA ======
// [start, end, type, text(s)]

  [9.490, 10.729, 'card', ['不是没做']],

  [13.749, 15.590, 'card', ['想补测也补不了']],
  [15.590, 17.719, 'bare', ['最后拆了三块石膏板']],
  [17.719, 20.729, 'card-orange', ['伸手机拍了张照片糊弄过去']],

  [27.118, 29.675, 'btitle', ['不像水电隐蔽那么受重视']],
  [29.675, 31.226, 'card', ['很多工地觉得']],

  [54.942, 56.874, 'card', ['必须封板前做']],
  [56.874, 58.298, 'bare', ['灯一打人一看']],
  [58.298, 60.011, 'card-orange', ['有漏光就补']],
  [60.011, 61.319, 'card', ['补完再测']],
  [61.319, 62.708, 'card-blue', ['直到合格']],
  [62.708, 66.655, 'bare', ['有人用手机闪光灯晃一下就完事']],
  [66.655, 68.182, 'card-orange', ['那不是检测']],
  [68.182, 69.548, 'card', ['是走过场']],
  [69.548, 71.273, 'btitle', ['第二件是支吊架']],

  [74.085, 75.486, 'card', ['运行半年后']],

  [119.791, 121.261, 'card-blue', ['一条一条过']],
  [121.261, 123.796, 'card', ['刚开始推行嫌麻烦']],
  [123.796, 125.891, 'bare', ['两个月后没人说话了']],
  [125.891, 127.881, 'card-orange', ['因为返工率确实降了']],
  [127.881, 130.231, 'btitle', ['老李养成了习惯']],

  [133.043, 134.999, 'bare', ['他自己拿个手电筒']],
  [134.999, 136.909, 'bmid', ['沿着风管走一圈']],
  [136.909, 138.645, 'bmid', ['不是不相信工人']],
  [138.645, 140.034, 'bmid', ['而是他知道']],
  [140.034, 141.898, 'btitle', ['有些东西现在不看']],
  [141.898, 143.935, 'card', ['以后想看也看不了了']],
  [143.935, 145.115, 'btitle', ['干这行']],
  [145.115, 146.539, 'btitle', ['手比嘴老实']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
      el.style.fontSize = '40px';
    }
    else if (type === 'card-blue') { el.className = 'm card-blue'; }
    else if (type === 'card-orange') { el.className = 'm card-orange'; }
    else { el.className = 'm'; }
    el.textContent = t;
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
