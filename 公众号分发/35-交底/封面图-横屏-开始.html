<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>封面-开始</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%); font-family: 'Microsoft YaHei','PingFang SC',sans-serif; display:flex; align-items:center; justify-content:center; }
.wrap { width:920px; text-align:center; }
h1 { font-size:96px; font-weight:900; color:#f0d060; text-shadow:0 0 50px rgba(240,208,96,0.3); margin-bottom:60px; }
h2 { font-size:52px; font-weight:700; color:#e8edf5; margin-bottom:30px; }
.sub { font-size:36px; color:#8899aa; letter-spacing:4px; }
.line { width:120px; height:4px; background:#f0d060; margin:40px auto; border-radius:2px; }
.footer { position:absolute; bottom:120px; left:0; width:100%; text-align:center; font-size:32px; color:#5a6a7a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">奇美星暖通风管制作</div>
  <div class="line"></div>
  <h1>技术交底</h1>
  <h2>写了没人看，看了没人做，做了没人验</h2>
  <div style="font-size:36px;color:#7ec8e3;margin-top:80px;">三个断点 + 三个笨办法</div>
</div>
<div class="footer">tangguoqi.top</div>
</body>
</html>
