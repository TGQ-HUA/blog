<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>封面-结尾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(150deg,#fef9ef,#f0fdf4,#ecfdf5);display:flex;flex-direction:column;align-items:center;justify-content:center}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
.orb1{width:500px;height:500px;top:-100px;left:-80px;background:radial-gradient(circle,rgba(22,163,74,.35),transparent)}
.orb2{width:400px;height:400px;bottom:-60px;right:-60px;background:radial-gradient(circle,rgba(37,99,235,.45),transparent)}
.content{position:relative;z-index:10;text-align:center;padding:40px}
.card{background:rgba(255,255,255,.22);backdrop-filter:blur(20px);border-radius:22px;padding:30px 60px;box-shadow:0 8px 32px rgba(0,0,0,.05);margin-bottom:30px;max-width:1400px}
.card p{font-size:38px;color:#475569;line-height:1.6}
.highlight{font-size:60px;font-weight:900;color:#16a34a;margin:20px 0}
.q{font-size:44px;font-weight:700;color:#1e293b;margin:10px 0}
.footer{font-size:28px;color:#94a3b8;margin-top:20px}
.brand{font-size:36px;font-weight:700;color:#2563eb;margin-top:30px;letter-spacing:2px}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="content">
  <div class="card">
    <p>车间师傅现在做复合风管</p>
    <p>第一件事就是拿卷尺量</p>
    <div class="q">"平不平？"</div>
    <div class="highlight">"不平重做"</div>
  </div>
  <div class="brand">奇美星暖通风管制作</div>
  <div class="footer">tangguoqi.top</div>
</div>
</body>
</html>
