<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>封面-开始</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(150deg,#fef9ef,#f0fdf4,#ecfdf5);display:flex;flex-direction:column;align-items:center;justify-content:center}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
.orb1{width:500px;height:500px;top:-100px;right:-80px;background:radial-gradient(circle,rgba(37,99,235,.45),transparent)}
.orb2{width:400px;height:400px;bottom:-60px;left:-60px;background:radial-gradient(circle,rgba(22,163,74,.35),transparent)}
.content{position:relative;z-index:10;text-align:center;padding:40px}
h1{font-size:80px;font-weight:900;color:#1e293b;margin-bottom:10px}
h1 span{color:#dc2626}
.tag{font-size:38px;color:#2563eb;font-weight:600;margin-bottom:50px;letter-spacing:2px}
.card{background:rgba(255,255,255,.22);backdrop-filter:blur(20px);border-radius:22px;padding:30px 60px;box-shadow:0 8px 32px rgba(0,0,0,.05);margin-bottom:30px}
.card p{font-size:34px;color:#475569;line-height:1.6}
.footer{font-size:28px;color:#94a3b8;margin-top:20px}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="content">
  <div class="card">
    <h1>复合风管</h1>
    <h1>看着简单<span>做着难</span></h1>
  </div>
  <div class="tag">风管厂踩过的三个坑</div>
  <div class="footer">奇美星暖通风管制作 · tangguoqi.top</div>
</div>
</body>
</html>
