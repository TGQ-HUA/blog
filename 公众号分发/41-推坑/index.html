<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>系统没人用怎么办 - 风管厂推坑史</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden; 
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  display: flex; align-items: center; justify-content: center;
}
#stage {
  position:relative; width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.m { 
  position:absolute; opacity:0; font-size:42px; line-height:1.5;
  color:#e8edf5; text-align:center; width:900px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:96px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:72px; font-weight:700; color:#7ec8e3; }
.bare { background:none; backdrop-filter:none; border:none; font-size:44px; }
.card-accent { border-color:rgba(240,208,96,0.25); background:rgba(240,208,96,0.04); }
.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
.m-sep { height:14px; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="122">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="122" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>
// ====== BEAT DATA ======
// [start, end, type, text(s)]
const beats = [
  [0.100, 3.985, 'btitle', ['系统做好了', '没人点']],
  [3.935, 7.245, 'card', ['师傅们就是不点那个按钮', '不是懒，是怕点错了还要写检查']],
  [7.245, 10.057, 'bare', ['我把系统做出来那天', '信心满满']],
  [10.057, 13.252, 'card', ['结果第一天没人用', '第二天还是没人用']],
  [13.252, 16.805, 'bare', ['问同事为什么不登系统', '他说"忘了"']],
  [16.805, 19.548, 'btitle', ['不是一个人忘', '是所有人都在忘']],
  [19.548, 24.606, 'card', ['在风管厂待久了就知道', '大家对电脑上的新东西天然有戒心']],
  [24.606, 27.152, 'bare', ['不是懒', '是怕出错担责任']],
  [27.152, 32.048, 'card-accent', ['旧流程：', '排版文件存在本地，忘了就丢']],
  [32.048, 35.451, 'card-accent', ['旧流程：', '出错记录口头传达，过周不记得']],
  [35.451, 39.236, 'bare', ['旧流程：', '工作量月底翻台账，对不上算大概']],
  [39.236, 41.493, 'btitle', ['效率低', '但大家习惯了']],
  [41.493, 45.995, 'card', ['新系统呢？', '每件事都要点确认、填备注、选类型']],
  [45.995, 48.437, 'btitle', ['对师傅们来说', '这就叫"多事"']],
  [48.437, 51.215, 'card', ['我拆了三堵墙', '才把系统跑起来']],
  [51.215, 53.182, 'btitle', ['第一堵墙', '怕点错']],
  [53.182, 57.557, 'card', ['我加了误操作撤回', '删除只做标记不真删']],
  [57.557, 61.053, 'card-blue', ['"你随便点', '点错了能恢复"']],
  [61.053, 63.495, 'bare', ['这句话', '比任何培训都管用']],
  [63.495, 66.112, 'btitle', ['第二堵墙', '出错登记没人填']],
  [66.112, 70.254, 'card', ['大家觉得填出错登记', '= 打小报告 = 得罪人']],
  [70.254, 73.298, 'bare', ['我把名字去掉', '改成"技术部经验库"']],
  [73.298, 78.333, 'card-blue', ['定期汇总十大高频错误', '只说怎么避免，不说谁犯的']],
  [78.333, 80.127, 'bare', ['填的人', '慢慢多了']],
  [80.127, 82.881, 'btitle', ['第三堵墙', '检查流程太复杂']],
  [82.881, 86.111, 'card', ['原来有十来步', '师傅忙起来直接跳过']],
  [86.111, 90.289, 'card-accent', ['压缩成三步：', '项目信息 → 排版文件 → 确认下单']],
  [90.289, 94.409, 'bare', ['超过五节的管件', '系统单独弹个窗确认']],
  [94.409, 99.085, 'btitle', ['几个月下来', '系统从没人碰变成了离不开']],
  [99.085, 102.685, 'btitle', ['真正能让人用起来', '就三个条件']],
  [102.685, 105.532, 'card', ['① 省事', '点两次搞定，别点五次']],
  [105.532, 108.738, 'bare', ['② 不罚人', '出错记录是经验不是罪证']],
  [108.738, 111.469, 'card', ['③ 能回看', '做过的活随时能查到']],
  [111.469, 115.138, 'card-blue', ['端午节前', '一个师傅突然说：']],
  [115.138, 118.483, 'card-blue', ['"那个系统挺好用的', '帮我查一下宜春项目"']],
  [118.483, 121.331, 'bare', ['那一刻', '之前熬的夜，值了']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:920px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { el.className = 'm bare'; }
    else if (type === 'card-accent') { el.className = 'm card-accent'; }
    else if (type === 'card-blue') { el.className = 'm card-blue'; }
    else if (type === 'card-orange') { el.className = 'm card-orange'; }
    else { el.className = 'm'; }
    el.textContent = t;
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  // Fade in
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  // Hold
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  // Fade out
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
