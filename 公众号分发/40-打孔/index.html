<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>打孔规则</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:1080px; height:1920px; overflow:hidden; 
  background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
  font-family: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  display: flex; align-items: center; justify-content: center;
}
#stage {
  position:relative; width:960px; height:1720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.m { 
  position:absolute; opacity:0; font-size:42px; line-height:1.5;
  color:#e8edf5; text-align:center; width:880px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:88px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:72px; font-weight:700; color:#7ec8e3; }
.bnum { font-size:100px; font-weight:900; color:#ff7e5f; }
.m-sep { height:14px; }
.card-accent { border-color:rgba(240,208,96,0.25); background:rgba(240,208,96,0.04); }
.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="127">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="127" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>
// ====== BEAT DATA ======
// [start, end, type, text(s)]
const beats = [
  [0.1, 3.695, 'btitle', ['共板法兰打孔', '旧规则和新规则差在哪']],
  [3.645, 6.550, 'bare', ['一个孔距算错', '整排法兰全废']],
  [6.550, 9.733, 'card', ['上个月车间老张', '拿了块法兰料来找我']],
  [9.733, 14.641, 'card', ['边距七十五', '到中间变成一百三十多']],
  [14.641, 18.240, 'bare', ['两头稀中间密', '装上去就不对劲']],
  [18.240, 21.168, 'card', ['甲方拍了照', '问这风管质量能好']],
  [21.168, 22.511, 'bmid', ['我无言以对']],
  [22.511, 25.393, 'card-blue', ['甲方不一定懂技术', '但眼睛不瞎']],
  [25.393, 27.407, 'bmid', ['问题出在旧规则上']],
  [27.407, 29.490, 'card-accent', ['旧规则', '固定首孔']],
  [29.490, 33.124, 'card', ['两端固定110mm边距', '中间再均分']],
  [33.124, 37.488, 'bare', ['800mm边长', '算出来还行']],
  [37.488, 40.335, 'card', ['两端110', '中间116']],
  [40.335, 42.534, 'bmid', ['但换650mm试试']],
  [42.534, 45.636, 'card-orange', ['两端110', '中间107.5']],
  [45.636, 47.326, 'bare', ['差了2.5mm']],
  [47.326, 49.884, 'card', ['孔一多就是', '两边松中间紧']],
  [49.884, 53.298, 'card-orange', ['小边更离谱', '<220mm就不打孔了']],
  [53.298, 56.331, 'bmid', ['2026年1月6号', '我们把规则改了']],
  [56.331, 58.114, 'bare', ['换成整边均分']],
  [58.114, 60.648, 'card-blue', ['整条边等分', '每个孔距一样']],
  [60.648, 65.312, 'card', ['800mm六段五个孔', '孔距133.3mm']],
  [65.312, 68.032, 'bare', ['甲方拿尺子量', '任何一个都一样']],
  [68.032, 69.421, 'bmid', ['说不出闲话']],
  [69.421, 73.715, 'card', ['650mm五段四个孔', '孔距130mm']],
  [73.715, 76.087, 'card', ['改了之后', '车间师傅高兴了']],
  [76.087, 79.699, 'card', ['旧规则背两个数', '新规则一句话讲完']],
  [79.699, 82.812, 'bare', ['整条边均分', '<150mm不打孔']],
  [82.812, 84.988, 'card', ['新来的学徒', '教一次就会']],
  [84.988, 86.446, 'bmid', ['返工也少了']],
  [86.446, 90.601, 'card', ['以前半年碰过', '三四次退货']],
  [90.601, 92.987, 'card-blue', ['换规则之后', '一次都没有']],
  [92.987, 94.780, 'bare', ['有个要注意的地方']],
  [94.780, 98.344, 'card-blue', ['孔距<100mm时', '还是用固定首孔']],
  [98.344, 102.570, 'bare', ['边长太短', '整边均分可能更大']],
  [102.570, 106.828, 'card', ['打孔在风管制造里', '是很小的环节']],
  [106.828, 110.313, 'bmid', ['但越小的环节', '越能看出底子']],
  [110.313, 112.951, 'bare', ['改一个孔距算法', '成本为零']],
  [112.951, 117.245, 'card', ['车间顺眼了', '甲方没话说了', '返工也少了']],
  [117.245, 120.856, 'card-orange', ['这种改动不做', '不是技术问题', '是意识问题']],
  [120.856, 126.608, 'card', ['奇美星暖通风管制作', '技术干货 工具心得', 'tangguoqi.top']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
    }
    else { el.className = 'm ' + (type === 'card-blue' ? 'card-blue' : type === 'card-orange' ? 'card-orange' : type === 'card-accent' ? 'card-accent' : ''); }
    el.textContent = t;
    if (type === 'bare') el.style.fontSize = '44px';
    if (type === 'btitle') el.style.fontSize = '88px';
    if (type === 'bmid') el.style.fontSize = '72px';
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
