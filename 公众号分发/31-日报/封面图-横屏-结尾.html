<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080"><title>风管厂日报-结尾</title>

.url{font-size:26px;color:#64748b;margin-top:6px}
.qr{width:160px;height:160px;margin-top:20px;background:#e2e8f0;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:20px}

</head>
<body>
<div class="orb" style="width:400px;height:400px;top:-80px;left:-60px;background:radial-gradient(circle,rgba(37,99,235,.4),transparent)"></div>

<div class="center">
