}

  position:relative; width:960px; height:1720px;

}

  color:#e8edf5; text-align:center; width:880px;
  padding:36px 44px; border-radius:22px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}
.btitle { font-size:96px; font-weight:900; color:#f0d060; text-shadow:0 0 40px rgba(240,208,96,0.3); }
.bmid { font-size:88px; font-weight:700; color:#7ec8e3; }
.bnum { font-size:100px; font-weight:900; color:#ff7e5f; }
.m-sep { height:14px; }

.card-blue { border-color:rgba(126,200,227,0.25); background:rgba(126,200,227,0.04); }
.card-orange { border-color:rgba(255,126,95,0.25); background:rgba(255,126,95,0.04); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-width="1080" data-height="1920" data-duration="128">
<audio id="audio" src="narration.mp3" data-start="0" data-duration="128" data-track-index="0" data-volume="1"></audio>
</div>

<script src="gsap.min.js"></script>
<script>

  [41.087, 42.928, 'card-blue', ['④ 料头有复用阈值']],
  [42.928, 44.432, 'bmid', ['试了三个版本']],
  [44.432, 45.729, 'bmid', ['才走对路']],
  [45.729, 47.384, 'card-orange', ['第一版 · 贪心排']],
  [47.384, 49.189, 'bare', ['尺寸从大到小']],
  [49.189, 51.516, 'card', ['废料率超过 15%']],
  [51.516, 54.560, 'card', ['"这不就是手动排版的结果吗？"']],
  [54.560, 56.307, 'card-orange', ['第二版 · 整数规划']],
  [56.307, 58.402, 'bare', ['用线性规划求解器']],
  [58.402, 60.972, 'card', ['20种规格 ➔ 快时30秒']],
  [60.972, 62.696, 'card', ['慢时要3分钟']],
  [62.696, 65.092, 'card', ['改一种尺寸 ➔ 从头算']],
  [65.092, 67.719, 'bmid', ['做工具最怕的']],

  [69.479, 71.446, 'card-orange', ['第三版 · 分仓组合法']],
  [71.446, 73.506, 'bare', ['灵感来自师傅一句话']],
  [73.506, 76.146, 'card', ['"先把长料留出来做大规格"']],

  [80.439, 82.048, 'card-blue', ['② 大料优先切']],

  [87.175, 89.317, 'bare', ['废料率']],
  [89.317, 91.493, 'btitle', ['12~18% ➔ 6~8%']],
  [91.493, 93.599, 'bare', ['代码不超过2000行']],
  [93.599, 95.428, 'bare', ['核心就几个函数']],

  [116.851, 119.108, 'card', ['老李现在每天打开程序']],
  [119.108, 121.377, 'card', ['看一眼料头表就去干活']],
  [121.377, 123.391, 'card', ['不用拿计算机算了']],
  [123.391, 125.069, 'btitle', ['这才是风管厂']],
  [125.069, 127.080, 'btitle', ['自己写工具的意义']],
];

// ====== BUILD DOM ======
const stage = document.getElementById('stage');
beats.forEach((b, idx) => {
  const [start, end, type, texts] = b;
  const div = document.createElement('div');
  div.id = 'b' + idx;
  div.style.cssText = 'position:absolute;opacity:0;width:880px;text-align:center;';
  texts.forEach(t => {
    const el = document.createElement('div');
    if (type === 'btitle') { el.className = 'm btitle'; }
    else if (type === 'bmid') { el.className = 'm bmid'; }
    else if (type === 'bare') { 
      el.className = 'm';
      el.style.background = 'none'; el.style.backdropFilter = 'none'; el.style.border = 'none';
    }
    else { el.className = 'm ' + (type === 'card-blue' ? 'card-blue' : type === 'card-orange' ? 'card-orange' : ''); }
    el.textContent = t;
    if (type === 'bare') el.style.fontSize = '44px';
    div.appendChild(el);
  });
  stage.appendChild(div);
});

// ====== GSAP TIMELINE ======
const tl = gsap.timeline({paused:false});
beats.forEach((b, idx) => {
  const [start, end, type] = b;
  const el = '#b' + idx;
  const dur = end - start - 0.3;
  // Fade in
  tl.to(el, { opacity:1, scale:1, duration:0.3, ease:'back.out(1.2)' }, start);
  // Hold
  tl.to({}, { duration: Math.max(0, dur) }, start + 0.3);
  // Fade out
  tl.to(el, { opacity:0, scale:0.95, duration:0.2, ease:'power2.in' }, end - 0.2);
});

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
</script>
</body>
</html>
