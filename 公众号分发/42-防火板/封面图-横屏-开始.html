<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>封面-开始</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(145deg,#0b0e14 0%,#1f2535 100%);display:flex;align-items:center;justify-content:center;font-family:'Microsoft YaHei','PingFang SC',sans-serif;}
.wrap{text-align:center;width:1700px;}
h1{font-size:96px;font-weight:900;color:#f0d060;text-shadow:0 0 40px rgba(240,208,96,0.3);margin-bottom:30px;}
h2{font-size:48px;color:#e8edf5;margin-bottom:20px;}
.sub{font-size:36px;color:#8899aa;margin-top:40px;}
.line{width:200px;height:4px;background:rgba(240,208,96,0.4);margin:20px auto;border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">
<div class="line"></div>
<h1>防火板风管</h1>
<h2>小厂不敢碰，大厂也头疼</h2>
<h2>——到底难在哪</h2>
<div class="line"></div>
<div class="sub">奇美星暖通风管制作</div>
</div>
</body>
</html>
